<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1169a5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="HLM Berichte"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="manifest" href="manifest.webmanifest"><title>HLM Klima · Objektberichte</title><link rel="stylesheet" href="style.css"></head><body><header><img src="logo.jpg" alt="HLM Klima AG"><p>Objektberichte</p></header><main><section id="home"><div class="toolbar"><h1>Meine Berichte</h1><button id="new" class="primary">+ Neuer Bericht</button></div><div id="reports"></div><div class="backup"><h2>Datensicherung</h2><p>Berichte und Fotos liegen nur auf diesem Gerät. Regelmässig eine Sicherung erstellen und ausserhalb des Browsers aufbewahren.</p><button id="export">Sicherung exportieren</button> <button id="import">Sicherung importieren</button><input type="file" id="backupFile" accept="application/json,.json" hidden></div></section><section id="editor" hidden><div class="toolbar"><button id="back">← Berichte</button><button id="save" class="primary">Speichern</button></div><h1>Objektbericht</h1><label>Objektname <input id="object" autocomplete="off" placeholder="z. B. Geschäftshaus Kloten"></label><label>Adresse <textarea id="address" rows="2" placeholder="Strasse, PLZ Ort"></textarea></label><label>Kunde / Auftrag <input id="customer" placeholder="Optional"></label><label>Datum <input id="date" type="date"></label><div class="toolbar"><h2>Fotos und Kommentare</h2><label class="button">+ Fotos hinzufügen<input type="file" id="photos" accept="image/*" multiple hidden></label></div><p class="hint">Auf dem iPhone kannst du neue Fotos aufnehmen oder bestehende auswählen.</p><div id="photoList"></div><div class="actions"><button id="pdf" class="primary">PDF erstellen / Drucken</button><button id="delete" class="danger">Bericht löschen</button></div></section></main><div id="printArea"></div><script src="app.js"></script></body></html>
